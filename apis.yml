name: Courtyard
description: 'Courtyard (courtyard.io) is a marketplace and tokenization service for
  physical collectibles — trading cards, luxury watches, and other graded assets. Collectors
  vault a physical item in Courtyard''s insured facility and receive a blockchain-backed
  digital token (an NFT on Ethereum/Polygon) representing verified ownership, which
  can then be instantly bought, sold, bid on, or redeemed for physical shipment. The
  platform combines a "Proof of Integrity" authentication process, KYC-gated onboarding,
  a hosted wallet with fiat funding, digital pack drops and auctions, and a curated
  showroom experience. Courtyard is a Forerunner Ventures portfolio company operating
  in the commerce / collectibles sector; it exposes a consumer web application and
  smart contracts rather than a public developer API.'
